<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Your Wishlist | Envie Roses</title>
  <meta name="description" content="Roses you have saved.">
  <meta name="theme-color" content="#0b0b0b">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Your Wishlist | Envie Roses">
  <meta property="og:description" content="Roses you have saved.">
  <meta property="og:image" content="images/hero.jpg">
  <meta property="og:locale" content="en_GB">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%230b0b0b'/%3E%3Cg fill='none' stroke='%23c9a96e' stroke-width='2'%3E%3Cpath d='M20 9c4 2 7 5 7 9.5S23.8 27 20 27s-7-3.5-7-8.5S16 11 20 9z'/%3E%3Cpath d='M20 27v5'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/catalog.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/layout.js"></script>
</head>
<body>
  <script>EnvieLayout.top(null);</script>

  <main id="main">
    <script>EnvieLayout.pageHero({"title": "Your Wishlist", "kicker": "Saved for Later", "intro": "Roses you’ve saved on this device.", "crumb": "Wishlist"});</script>
    <section class="section">
      <div class="container">
        <div class="product-grid" id="wishGrid"></div>
        <div class="shop-empty" id="wishEmpty" hidden>
          <p>Your wishlist is empty.</p>
          <p class="wish-hint">Tap the heart on any product to save it here.</p>
          <a href="shop.html" class="btn btn--gold btn--sm">Shop the Collection</a>
        </div>
      </div>
    </section>
  </main>

  <script>EnvieLayout.bottom();</script>

  <script src="js/main.js"></script>
  <script src="js/shop.js"></script>
  <script>
    (function () {
      const render = () => {
        const ids = EnvieLayout.wishlist.ids();
        document.getElementById('wishGrid').innerHTML = ids.map(EnvieLayout.productCard).join('');
        document.getElementById('wishEmpty').hidden = ids.length > 0;
      };
      render();
      // Removing a heart here takes the product off the list straight away
      document.addEventListener('envie:wishlist', (e) => { if (!e.detail.on) render(); });
    })();
  </script>
</body>
</html>
