<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>My Account | Envie Roses</title>
  <meta name="description" content="Log in to see your Envie Roses orders, loyalty points and Flower Club deliveries.">
  <meta name="theme-color" content="#0b0b0b">
  <meta property="og:type" content="website">
  <meta property="og:title" content="My Account | Envie Roses">
  <meta property="og:description" content="Log in to see your Envie Roses orders, loyalty points and Flower Club deliveries.">
  <meta property="og:image" content="images/hero.jpg">
  <meta property="og:locale" content="en_GB">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%230b0b0b'/%3E%3Cg fill='none' stroke='%23c9a96e' stroke-width='2'%3E%3Cpath d='M20 9c4 2 7 5 7 9.5S23.8 27 20 27s-7-3.5-7-8.5S16 11 20 9z'/%3E%3Cpath d='M20 27v5'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/catalog.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/layout.js"></script>
</head>
<body>
  <script>EnvieLayout.top(null);</script>

  <main id="main">
    <script>EnvieLayout.pageHero({"title": "My Account", "kicker": "Welcome", "intro": "Your orders, loyalty points and Flower Club deliveries in one place."});</script>
    <section class="section section--tight">
      <div class="container acct" id="acct" aria-busy="true">

        <!-- Logged out -->
        <div class="auth" id="authBox" hidden>
          <div class="auth__tabs" role="tablist">
            <button type="button" role="tab" class="is-on" data-tab="login" aria-selected="true">Log in</button>
            <button type="button" role="tab" data-tab="register" aria-selected="false">Create account</button>
          </div>
          <form class="auth__form" id="loginForm" data-pane="login" novalidate>
            <label class="field"><span>Email</span><input name="email" type="email" autocomplete="email" required></label>
            <label class="field"><span>Password</span><input name="password" type="password" autocomplete="current-password" required></label>
            <p class="form-error" role="alert"></p>
            <button type="submit" class="btn btn--gold btn--block">Log in</button>
            <button type="button" class="btn btn--link auth__forgot" data-tab="forgot">Forgotten your password?</button>
          </form>
          <form class="auth__form" id="registerForm" data-pane="register" novalidate hidden>
            <p class="auth__invite" id="inviteText" hidden></p>
            <p class="auth__perk" id="perkText"></p>
            <label class="field"><span>Full name</span><input name="name" autocomplete="name" required maxlength="100"></label>
            <label class="field"><span>Email</span><input name="email" type="email" autocomplete="email" required></label>
            <label class="field"><span>Phone <small>(optional)</small></span><input name="phone" type="tel" autocomplete="tel"></label>
            <label class="field"><span>Password <small>at least 8 characters</small></span><input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
            <label class="field" id="refField"><span>Friend&rsquo;s referral code <small>(optional)</small></span><input name="ref" id="refInput" maxlength="20" autocapitalize="characters" placeholder="e.g. AMELIA-7K2P"></label>
            <p class="auth__small">By creating an account you agree to our <a href="terms.html">Terms</a> and confirm you have read our <a href="privacy.html">Privacy Policy</a>.</p>
            <p class="form-error" role="alert"></p>
            <button type="submit" class="btn btn--gold btn--block">Create account</button>
          </form>
          <form class="auth__form" id="forgotForm" data-pane="forgot" novalidate hidden>
            <p>Enter your email and we&rsquo;ll send you a link to choose a new password.</p>
            <label class="field"><span>Email</span><input name="email" type="email" autocomplete="email" required></label>
            <p class="form-error" role="alert"></p>
            <p class="form-ok" role="status"></p>
            <button type="submit" class="btn btn--gold btn--block">Send reset link</button>
            <button type="button" class="btn btn--link auth__forgot" data-tab="login">Back to log in</button>
          </form>
          <form class="auth__form" id="resetForm" data-pane="reset" novalidate hidden>
            <p>Choose a new password for your account.</p>
            <label class="field"><span>New password <small>at least 8 characters</small></span><input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
            <p class="form-error" role="alert"></p>
            <button type="submit" class="btn btn--gold btn--block">Save new password</button>
          </form>
        </div>

        <!-- Logged in -->
        <div class="acct__app" id="acctApp" hidden>
          <aside class="acct__side">
            <p class="acct__hello">Hello, <strong id="acctName"></strong></p>
            <nav class="acct__nav" aria-label="My account">
              <a href="#overview" data-sec="overview">Overview</a>
              <a href="#orders" data-sec="orders">Orders</a>
              <a href="#subscriptions" data-sec="subscriptions">Flower Club</a>
              <a href="#points" data-sec="points">Loyalty Points</a>
              <a href="#refer" data-sec="refer" id="referNav">Refer a Friend</a>
              <a href="#addresses" data-sec="addresses">Addresses</a>
              <a href="#details" data-sec="details">My Details</a>
            </nav>
            <button type="button" class="btn btn--outline btn--sm" id="logout">Log out</button>
          </aside>
          <div class="acct__main" id="acctMain"></div>
        </div>

        <!-- Orders saved on this device (no account) -->
        <div class="acct__device" id="deviceOrders" hidden></div>
      </div>
    </section>
  </main>

  <script>EnvieLayout.bottom();</script>

  <script src="js/main.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/account.js"></script>
</body>
</html>
