<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Blog | Envie Roses</title>
  <meta name="description" content="Stories from Envie Roses.">
  <meta name="theme-color" content="#0b0b0b">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Blog | Envie Roses">
  <meta property="og:description" content="Stories from Envie Roses.">
  <meta property="og:image" content="images/hero.jpg">
  <meta property="og:locale" content="en_GB">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%230b0b0b'/%3E%3Cg fill='none' stroke='%23c9a96e' stroke-width='2'%3E%3Cpath d='M20 9c4 2 7 5 7 9.5S23.8 27 20 27s-7-3.5-7-8.5S16 11 20 9z'/%3E%3Cpath d='M20 27v5'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/catalog.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/layout.js"></script>
</head>
<body>
  <script>EnvieLayout.top("blog");</script>

  <main id="main">
    <article class="section post" id="post" aria-busy="true">
      <div class="container post__inner">
        <nav class="crumbs crumbs--light" aria-label="Breadcrumb"><a href="index.html">Home</a><span aria-hidden="true">/</span><a href="blog.html">Blog</a><span aria-hidden="true">/</span><span aria-current="page" id="postCrumb">Post</span></nav>
        <header class="post__head">
          <time id="postDate"></time>
          <h1 class="post__title" id="postTitle">Loading…</h1>
        </header>
        <figure class="post__cover" id="postCover" hidden></figure>
        <div class="post__body prose" id="postBody"></div>
        <div class="post__foot">
          <a href="blog.html" class="btn btn--outline btn--sm">← All posts</a>
          <a href="shop.html" class="btn btn--gold btn--sm">Shop the Collection</a>
        </div>
      </div>
    </article>
  </main>

  <script>EnvieLayout.bottom();</script>

  <script src="js/main.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/popup.js"></script>
  <script>
    (function () {
      const esc = EnvieLayout.esc;
      // Safe formatting: everything is escaped first, then ## headings, - bullets and **bold** are applied
      function render(text) {
        const inline = (t) => esc(t).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        return text.replace(/\r/g, '').split(/\n{2,}/).map((block) => {
          const lines = block.split('\n').map((l) => l.trim()).filter(Boolean);
          if (!lines.length) return '';
          if (lines.every((l) => l.startsWith('- '))) return '<ul>' + lines.map((l) => `<li>${inline(l.slice(2))}</li>`).join('') + '</ul>';
          if (lines[0].startsWith('## ')) return `<h2>${inline(lines[0].slice(3))}</h2>` + (lines.length > 1 ? `<p>${lines.slice(1).map(inline).join('<br>')}</p>` : '');
          return `<p>${lines.map(inline).join('<br>')}</p>`;
        }).join('');
      }
      const fail = (msg) => { document.getElementById('postTitle').textContent = msg; document.getElementById('post').removeAttribute('aria-busy'); };
      const slug = new URLSearchParams(location.search).get('slug') || '';
      if (location.protocol === 'file:') return fail('Blog posts load on the live website.');
      fetch('/api/posts?slug=' + encodeURIComponent(slug)).then((r) => (r.ok ? r.json() : Promise.reject())).then((p) => {
        document.title = `${p.title} | Envie Roses`;
        const meta = document.querySelector('meta[name="description"]');
        if (meta) meta.content = p.excerpt || p.title;
        document.getElementById('postCrumb').textContent = p.title;
        document.getElementById('postTitle').textContent = p.title;
        const t = document.getElementById('postDate');
        t.dateTime = p.date;
        t.textContent = new Date(p.date + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
        if (p.cover) { const f = document.getElementById('postCover'); f.hidden = false; f.innerHTML = `<img ${EnvieLayout.imgAttrs(p.cover, '(max-width: 900px) 100vw, 860px')} alt="">`; }
        document.getElementById('postBody').innerHTML = render(p.body || '');
        document.getElementById('post').removeAttribute('aria-busy');
      }).catch(() => fail('Post not found'));
    })();
  </script>
</body>
</html>
