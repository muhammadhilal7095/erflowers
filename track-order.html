<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Track Your Order | Envie Roses</title>
  <meta name="description" content="Check the status of your Envie Roses order with your order reference and postcode.">
  <meta name="theme-color" content="#0b0b0b">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Track Your Order | Envie Roses">
  <meta property="og:description" content="Check the status of your Envie Roses order with your order reference and postcode.">
  <meta property="og:image" content="images/hero.jpg">
  <meta property="og:locale" content="en_GB">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%230b0b0b'/%3E%3Cg fill='none' stroke='%23c9a96e' stroke-width='2'%3E%3Cpath d='M20 9c4 2 7 5 7 9.5S23.8 27 20 27s-7-3.5-7-8.5S16 11 20 9z'/%3E%3Cpath d='M20 27v5'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/catalog.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/layout.js"></script>
</head>
<body>
  <script>EnvieLayout.top(null);</script>

  <main id="main">
    <script>EnvieLayout.pageHero({"title": "Track Your Order", "kicker": "Customer Care", "intro": "Enter your order reference and delivery postcode.", "crumb": "Track Order"});</script>
    <section class="section">
      <div class="container track">
        <form class="track__form" id="trackForm" novalidate>
          <div class="co-grid">
            <label class="field"><span>Order reference *</span><input name="orderId" id="trackId" required placeholder="e.g. ER-261104-AB12" autocapitalize="characters" maxlength="20"></label>
            <label class="field"><span>Delivery postcode *</span><input name="postcode" id="trackPc" required placeholder="e.g. SW1A 1AA" autocapitalize="characters" maxlength="10"></label>
          </div>
          <p class="form-error" role="alert"></p>
          <button type="submit" class="btn btn--gold btn--block">Track my order</button>
          <p class="enquiry__small">Your order reference is in your WhatsApp message or confirmation email. Logged in? See all your orders in <a href="account.html#orders">My Account</a>.</p>
        </form>
        <div class="track__result" id="trackResult" hidden></div>
      </div>
    </section>
  </main>

  <script>EnvieLayout.bottom();</script>

  <script src="js/main.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/popup.js"></script>
  <script>
    (function () {
      const $ = (id) => document.getElementById(id);
      const { esc } = EnvieLayout;
      const form = $('trackForm');
      const STEPS = ['Order received', 'Being prepared', 'Out for delivery', 'Delivered'];
      async function track(orderId, postcode) {
        const err = form.querySelector('.form-error');
        err.textContent = '';
        if (location.protocol === 'file:') { err.textContent = 'Order tracking works on the live website.'; return; }
        const res = await fetch('/api/track', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ orderId, postcode }) });
        const d = await res.json().catch(() => ({}));
        const box = $('trackResult');
        if (!res.ok) { box.hidden = true; err.textContent = d.error || 'Something went wrong.'; return; }
        const when = d.date ? new Date(d.date + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' }) : '';
        box.hidden = false;
        box.innerHTML = `
          <p class="kicker">Order ${esc(d.id)}</p>
          <h2 class="track__status">${esc(d.statusLabel)}</h2>
          ${d.cancelled ? '<p>This order was cancelled. Please contact us if you have any questions.</p>' : `
          <ol class="track__steps">${STEPS.map((s, i) => `<li class="${i <= d.step ? 'is-done' : ''}${i === d.step ? ' is-now' : ''}"><span></span>${s}</li>`).join('')}</ol>
          <p>${when ? `Delivery: <strong>${when}</strong>${d.slot ? `, ${esc(d.slot)}` : ''}${d.sameDay ? ' (same day)' : ''}` : ''}</p>`}
          <ul class="track__items">${d.items.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>
          <a href="#" class="btn btn--outline btn--sm" data-enquire="my order ${esc(d.id)}"><svg class="icon"><use href="#i-whatsapp"/></svg> Ask about this order</a>`;
        box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        if (!form.checkValidity()) { form.querySelector('.form-error').textContent = 'Please enter your order reference and postcode.'; return; }
        track($('trackId').value.trim(), $('trackPc').value.trim());
      });
      const q = new URLSearchParams(location.search);
      if (q.get('order') && q.get('postcode')) { $('trackId').value = q.get('order'); $('trackPc').value = q.get('postcode'); track(q.get('order'), q.get('postcode')); }
    })();
  </script>
</body>
</html>
